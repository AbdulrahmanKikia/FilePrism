[package]
name = "fileprism-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "FilePrism Tauri desktop shell"

[lib]
name = "fileprism_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
fileprism-core = { workspace = true }
fileprism-history = { workspace = true }
fileprism-formats-image = { workspace = true }
fileprism-formats-doc = { workspace = true }
fileprism-formats-data = { workspace = true }
fileprism-formats-archive = { workspace = true }
