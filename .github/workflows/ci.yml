name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cargo-check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf nasm g++
      - run: cargo check --workspace

  cargo-test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf nasm g++
      # Exclude host cdylib crates that pull rav1d/dav1d without -fPIC and fail
      # rust-lld (R_X86_64_PC32) on Linux CI:
      # - fileprism-desktop (Tauri shell)
      # - fileprism-wasm (feature-unifies formats-image `avif` with other workspace crates)
      # Format/core crates still cover conversion; desktop/wasm stay in cargo check.
      # Isolated wasm test keeps formats-image default-features=false (no dav1d).
      - run: cargo test --workspace --exclude fileprism-desktop --exclude fileprism-wasm
      - name: cargo test fileprism-wasm (isolated, no AVIF)
        run: cargo test -p fileprism-wasm

  pnpm-build:
    name: pnpm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # version comes from package.json "packageManager" (pnpm@9.15.0)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
