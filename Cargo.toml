[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/formats-image",
    "crates/formats-doc",
    "crates/formats-data",
    "crates/formats-archive",
    "crates/unrar-sidecar",
    "crates/history",
    "crates/licensing",
    "crates/explorer-win",
    "crates/wasm",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Abdulrahman Mussa"]
repository = "https://github.com/AbdulrahmanKikia/FilePrism"

[workspace.dependencies]
fileprism-core = { path = "crates/core" }
fileprism-history = { path = "crates/history" }
fileprism-formats-image = { path = "crates/formats-image" }
fileprism-formats-doc = { path = "crates/formats-doc" }
fileprism-formats-data = { path = "crates/formats-data" }
fileprism-formats-archive = { path = "crates/formats-archive" }
fileprism-explorer-win = { path = "crates/explorer-win" }
fileprism-licensing = { path = "crates/licensing" }
fileprism-wasm = { path = "crates/wasm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Keep wasm custom sections so wasm-bindgen can detect target features.
[profile.release.package.fileprism-wasm]
strip = "none"
